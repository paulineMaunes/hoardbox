<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HoardBox v3.14</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for cute icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tesseract.js for robust in-browser OCR image analysis -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blush: {
                            50: '#fff5f7',
                            100: '#ffe4e8',
                            200: '#fecdd6',
                            300: '#fda4b4',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                        },
                        sakura: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            200: '#fbcfe8',
                            300: '#f472b6',
                            500: '#ec4899',
                        }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fff5f7;
            color: #4b5563;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #ffe4e8;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb {
            background: #fda4b4;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #fb7185;
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body class="bg-blush-50 min-h-screen pb-28 text-gray-700">

    <!-- Top Header -->
    <header class="sticky top-0 z-40 bg-white/85 backdrop-blur-md border-b border-blush-200 px-4 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-2">
            <span class="text-2xl animate-float">🎀</span>
            <div>
                <h1 class="font-bold text-lg text-rose-600 leading-tight">HoardBox <span class="text-xs bg-blush-100 text-rose-500 px-2 py-0.5 rounded-full">v3.14</span></h1>
                <p class="text-xs text-gray-400">Your aesthetic storage sanctuary ✨</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openQRScanner()" class="w-10 h-10 rounded-full bg-blush-100 text-rose-600 flex items-center justify-center hover:bg-blush-200 transition shadow-sm" title="Scan QR Code">
                <i class="fa-solid fa-qrcode"></i>
            </button>
            <button onclick="openAICameraModal()" class="w-10 h-10 rounded-full bg-blush-100 text-rose-600 flex items-center justify-center hover:bg-blush-200 transition shadow-sm" title="AI Camera Analyzer & Locate">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>
            <button onclick="openSettingsModal()" class="w-10 h-10 rounded-full bg-blush-100 text-rose-600 flex items-center justify-center hover:bg-blush-200 transition shadow-sm" title="Settings">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="max-w-4xl mx-auto p-4">
        <!-- Dynamic Views -->
    </main>

    <!-- Bottom Navigation Bar with Perfectly Centered Floating '+' Button -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-blush-200 px-4 py-2 z-30 shadow-lg flex items-center justify-between">
        <button onclick="switchTab('items')" id="nav-items" class="flex flex-col items-center justify-center flex-1 py-1 text-rose-500 transition">
            <i class="fa-solid fa-box-open text-lg"></i>
            <span class="text-[10px] font-medium mt-0.5 whitespace-nowrap">Items</span>
        </button>
        <button onclick="switchTab('racks')" id="nav-racks" class="flex flex-col items-center justify-center flex-1 py-1 text-gray-400 hover:text-rose-500 transition">
            <i class="fa-solid fa-layer-group text-lg"></i>
            <span class="text-[10px] font-medium mt-0.5 whitespace-nowrap">Racks</span>
        </button>

        <!-- Perfectly Centered Floating Action Button -->
        <div class="relative flex items-center justify-center px-4">
            <button onclick="openGlobalAddModal()" class="w-14 h-14 bg-gradient-to-r from-rose-500 to-pink-500 text-white rounded-full shadow-lg flex items-center justify-center text-xl hover:scale-105 active:scale-95 transition-all ring-4 ring-white shadow-rose-200">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <button onclick="switchTab('categories')" id="nav-categories" class="flex flex-col items-center justify-center flex-1 py-1 text-gray-400 hover:text-rose-500 transition">
            <i class="fa-solid fa-tags text-lg"></i>
            <span class="text-[10px] font-medium mt-0.5 whitespace-nowrap">Categories</span>
        </button>
        <button onclick="switchTab('boxes')" id="nav-boxes" class="flex flex-col items-center justify-center flex-1 py-1 text-gray-400 hover:text-rose-500 transition">
            <i class="fa-solid fa-boxes-stacked text-lg"></i>
            <span class="text-[10px] font-medium mt-0.5 whitespace-nowrap">Boxes</span>
        </button>
    </nav>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <!-- Application JavaScript -->
    <script>
        let currentTab = 'items';
        let db = {
            items: [],
            racks: [],
            boxes: [],
            categories: []
        };

        const DEFAULT_DEMO_DATA = {
            categories: [
                { id: 'cat-1', name: 'Kawaii Plushies', icon: 'cat', color: '#fda4b4', isCustomIcon: false },
                { id: 'cat-2', name: 'Stationery & Washi', icon: 'pencil', color: '#f472b6', isCustomIcon: false },
                { id: 'cat-3', name: 'Skincare & Beauty', icon: 'pump-soap', color: '#fbcfe8', isCustomIcon: false },
                { id: 'cat-4', name: 'Electronics & Gadgets', icon: 'laptop', color: '#cbd5e1', isCustomIcon: false }
            ],
            racks: [
                { id: 'rack-pedestal-1', name: '3-Tier Pedestal Cabinet', description: 'Main glass display cabinet in the living room.', type: 'pedestal', storageBehavior: 'fixed', icon: '🏛️', layers: 3, isCollapsed: false },
                { id: 'rack-drawer-1', name: '8-Layer Pink Drawer', description: 'Plastic pink organizer tower for stickers and small bits.', type: 'drawer', storageBehavior: 'fixed', icon: '🗄️', layers: 8, isCollapsed: false },
                { id: 'rack-metal-1', name: '6-Layer Metal Shelf', description: 'Heavy duty steel shelving unit in the storage room.', type: 'metal', storageBehavior: 'multibox', icon: '🏗️', layers: 6, isCollapsed: false }
            ],
            boxes: [
                { id: 'box-big-1', name: 'Big Brown Box #1', type: 'big-brown', icon: '📦', locationId: 'rack-metal-1', layerIndex: 0 },
                { id: 'box-big-2', name: 'Big Brown Box #2', type: 'big-brown', icon: '📦', locationId: 'rack-metal-1', layerIndex: 1 },
                { id: 'box-small-1', name: 'Small Brown Box #1', type: 'small-brown', icon: '📦', locationId: 'rack-metal-1', layerIndex: 2 },
                { id: 'box-free-1', name: 'Unassigned Storage Box', type: 'big-brown', icon: '📦', locationId: null, layerIndex: null }
            ],
            items: [
                { id: 'item-1', name: 'Fluffy Bunny Plush', category: 'cat-1', boxId: null, rackId: 'rack-pedestal-1', layerIndex: 0, photo: 'https://placehold.co/200x200/ffe4e8/e11d48?text=Bunny+Plush', notes: 'Very soft and cute!', quantity: 1 },
                { id: 'item-2', name: 'Pastel Gel Pens Set', category: 'cat-2', boxId: 'box-big-1', rackId: null, layerIndex: null, photo: 'https://placehold.co/200x200/fce7f3/ec4899?text=Gel+Pens', notes: '0.5mm pastel ink', quantity: 1 },
                { id: 'item-3', name: 'Compact Cordless Vacuum', category: 'cat-4', boxId: null, rackId: 'rack-metal-1', layerIndex: 3, photo: 'https://placehold.co/200x200/f1f5f9/475569?text=Vacuum', notes: 'Stored directly on metal shelf tier', quantity: 1 }
            ]
        };

        function saveDB() {
            try {
                localStorage.setItem('hoardbox_v314_db', JSON.stringify(db));
            } catch (e) {
                console.error("Storage save failed:", e);
            }
        }

        function loadDB() {
            try {
                const saved = localStorage.getItem('hoardbox_v314_db');
                if (saved) {
                    db = JSON.parse(saved);
                    if (!db.items) db.items = [];
                    if (!db.racks) db.racks = [];
                    if (!db.boxes) db.boxes = [];
                    if (!db.categories) db.categories = [];
                    db.items.forEach(i => { if (i.quantity === undefined) i.quantity = 1; });
                    db.racks.forEach(r => { if (r.description === undefined) r.description = ''; });
                } else {
                    resetToFactoryDefaults(false);
                }
            } catch (e) {
                console.error("Storage load failed, restoring defaults:", e);
                resetToFactoryDefaults(false);
            }
        }

        function resetToFactoryDefaults(showAlert = true) {
            db = JSON.parse(JSON.stringify(DEFAULT_DEMO_DATA));
            saveDB();
            renderCurrentView();
            if (showAlert) {
                showToast("✨ Reset to factory defaults successfully!");
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            ['items', 'racks', 'categories', 'boxes'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tab) {
                    btn.classList.remove('text-gray-400');
                    btn.classList.add('text-rose-500');
                } else {
                    btn.classList.remove('text-rose-500');
                    btn.classList.add('text-gray-400');
                }
            });
            renderCurrentView();
        }

        function renderCurrentView() {
            const container = document.getElementById('main-content');
            container.innerHTML = '';
            if (currentTab === 'items') renderItemsView(container);
            else if (currentTab === 'racks') renderRacksView(container);
            else if (currentTab === 'categories') renderCategoriesView(container);
            else if (currentTab === 'boxes') renderBoxesView(container);
        }

        function renderItemsView(container) {
            const searchQuery = window._itemSearch || '';
            const selectedCat = window._itemCatFilter || '';

            const filteredItems = db.items.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || (item.notes && item.notes.toLowerCase().includes(searchQuery.toLowerCase()));
                const matchesCat = !selectedCat || item.category === selectedCat;
                return matchesSearch && matchesCat;
            });

            let html = `
                <div class="space-y-4">
                    <div class="flex flex-col sm:flex-row gap-2">
                        <div class="relative flex-1">
                            <i class="fa-solid fa-search absolute left-3 top-3.5 text-gray-400 text-sm"></i>
                            <input type="text" id="item-search-input" value="${searchQuery}" oninput="filterItemsSearch(this)" placeholder="Search all hoards & treasures (v3.14)..." class="w-full pl-10 pr-4 py-2 bg-white rounded-full border border-blush-200 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400 shadow-sm">
                        </div>
                        <select id="item-cat-filter" onchange="filterItemsCategory(this.value)" class="px-4 py-2 bg-white rounded-full border border-blush-200 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400 shadow-sm">
                            <option value="">All Categories</option>
                            ${db.categories.map(c => `<option value="${c.id}" ${selectedCat === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
                        </select>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            `;

            if (filteredItems.length === 0) {
                html += `
                    <div class="col-span-full py-12 text-center bg-white rounded-3xl border border-blush-200 shadow-sm p-6">
                        <span class="text-4xl block mb-2">📦</span>
                        <h3 class="font-semibold text-gray-600">No items found</h3>
                        <p class="text-xs text-gray-400 mt-1">Tap the plus button below to add your first treasure!</p>
                    </div>
                `;
            } else {
                filteredItems.forEach(item => {
                    const cat = db.categories.find(c => c.id === item.category) || { name: 'Uncategorized', icon: 'tag', color: '#cbd5e1', isCustomIcon: false };
                    let locationName = 'Unassigned';
                    if (item.boxId) {
                        const box = db.boxes.find(b => b.id === item.boxId);
                        if (box) locationName = `📦 ${box.name}`;
                    } else if (item.rackId) {
                        const rack = db.racks.find(r => r.id === item.rackId);
                        if (rack) locationName = `${rack.icon || '🗄️'} ${rack.name} (Layer ${item.layerIndex + 1})`;
                    }

                    const catIconHtml = cat.isCustomIcon ? `<span class="mr-1">${cat.icon}</span>` : `<i class="fa-solid fa-${cat.icon} mr-1"></i>`;
                    const itemQty = item.quantity !== undefined ? item.quantity : 1;

                    html += `
                        <div class="bg-white rounded-3xl p-4 border border-blush-200 shadow-sm flex flex-col justify-between hover:shadow-md transition">
                            <div>
                                <div class="flex items-center justify-between mb-3">
                                    <span class="text-xs px-2.5 py-1 rounded-full text-white font-medium flex items-center" style="background-color: ${cat.color}">
                                        ${catIconHtml} ${cat.name}
                                    </span>
                                    <div class="flex space-x-1">
                                        <button onclick="openEditItemModal('${item.id}')" class="w-8 h-8 rounded-full bg-blush-50 text-rose-500 flex items-center justify-center hover:bg-blush-100 transition"><i class="fa-solid fa-pen text-xs"></i></button>
                                        <button onclick="confirmDeleteItem('${item.id}')" class="w-8 h-8 rounded-full bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-100 transition"><i class="fa-solid fa-trash text-xs"></i></button>
                                    </div>
                                </div>
                                <div class="flex space-x-3 mb-3">
                                    <img src="${item.photo}" onerror="this.src='https://placehold.co/100x100/ffe4e8/e11d48?text=Image'" onclick="openImageZoomModal('${item.photo.replace(/'/g, "\\'")}')" class="w-16 h-16 rounded-2xl object-cover border border-blush-100 flex-shrink-0 cursor-zoom-in hover:opacity-90 transition" title="Click to zoom">
                                    <div class="overflow-hidden flex-1">
                                        <div class="flex items-center justify-between">
                                            <h3 class="font-semibold text-gray-800 truncate">${item.name}</h3>
                                            <span class="text-xs bg-blush-100 text-rose-600 px-2 py-0.5 rounded-full font-bold ml-1 flex-shrink-0">Qty: ${itemQty}</span>
                                        </div>
                                        <p class="text-xs text-gray-400 mt-0.5 line-clamp-2">${item.notes || 'No notes added.'}</p>
                                        <div class="mt-2 flex items-center space-x-2">
                                            <button onclick="adjustItemQuantity('${item.id}', -1)" class="w-6 h-6 rounded-full bg-blush-100 text-rose-600 text-xs font-bold flex items-center justify-center hover:bg-blush-200 transition">-</button>
                                            <span class="text-xs font-semibold text-gray-600">${itemQty}</span>
                                            <button onclick="adjustItemQuantity('${item.id}', 1)" class="w-6 h-6 rounded-full bg-blush-100 text-rose-600 text-xs font-bold flex items-center justify-center hover:bg-blush-200 transition">+</button>
                                            <button onclick="openEditItemQuantityModal('${item.id}')" class="text-[10px] text-rose-500 hover:underline ml-1">Edit Qty</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="pt-3 border-t border-blush-50 flex items-center justify-between text-xs text-gray-500">
                                <span class="truncate font-medium"><i class="fa-solid fa-location-dot text-rose-400 mr-1"></i> ${locationName}</span>
                                <button onclick="openLocateModal('${item.id}')" class="text-rose-500 hover:underline font-medium flex-shrink-0 ml-2 whitespace-nowrap">Locate 🔍</button>
                            </div>
                        </div>
                    `;
                });
            }

            html += `</div></div>`;
            container.innerHTML = html;
        }

        function adjustItemQuantity(itemId, delta) {
            const item = db.items.find(i => i.id === itemId);
            if (item) {
                item.quantity = Math.max(1, (item.quantity || 1) + delta);
                saveDB();
                renderCurrentView();
                showToast(`✨ Quantity updated to ${item.quantity}`);
            }
        }

        function openEditItemQuantityModal(itemId) {
            const item = db.items.find(i => i.id === itemId);
            if (!item) return;
            let html = `
                <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="font-bold text-lg text-rose-600">Edit Quantity ✨</h3>
                            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-blush-50 text-gray-500 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <p class="text-xs text-gray-500">Update quantity for <strong>${item.name}</strong>:</p>
                        <form onsubmit="saveItemQuantity(event, '${itemId}')" class="space-y-3">
                            <div>
                                <input type="number" id="modal-edit-qty-val" min="1" required value="${item.quantity || 1}" class="w-full px-4 py-2 bg-blush-50 rounded-2xl border border-blush-200 text-sm text-center font-bold focus:outline-none focus:ring-2 focus:ring-rose-400">
                            </div>
                            <div class="flex justify-end space-x-2 pt-2">
                                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-full text-xs font-semibold bg-gray-100 text-gray-600 whitespace-nowrap">Cancel</button>
                                <button type="submit" class="px-4 py-2 rounded-full text-xs font-semibold bg-rose-500 text-white shadow-sm whitespace-nowrap">Save Quantity</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').innerHTML = html;
        }

        function saveItemQuantity(e, itemId) {
            e.preventDefault();
            const val = parseInt(document.getElementById('modal-edit-qty-val').value);
            const item = db.items.find(i => i.id === itemId);
            if (item && !isNaN(val) && val >= 1) {
                item.quantity = val;
                saveDB();
                closeModal();
                renderCurrentView();
                showToast("✨ Quantity updated successfully!");
            }
        }

        function filterItemsSearch(inputElement) {
            window._itemSearch = inputElement.value;
            const cursorPosition = inputElement.selectionStart;
            renderItemsView(document.getElementById('main-content'));
            const newInput = document.getElementById('item-search-input');
            if (newInput) {
                newInput.focus();
                newInput.setSelectionRange(cursorPosition, cursorPosition);
            }
        }

        function filterItemsCategory(val) {
            window._itemCatFilter = val;
            renderItemsView(document.getElementById('main-content'));
        }

        function openImageZoomModal(imgSrc) {
            let html = `
                <div class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4 cursor-zoom-out" onclick="closeModal()">
                    <div class="relative max-w-2xl max-h-[90vh] flex items-center justify-center" onclick="event.stopPropagation()">
                        <img src="${imgSrc}" class="max-w-full max-h-[85vh] rounded-3xl object-contain shadow-2xl border-4 border-white/20">
                        <button onclick="closeModal()" class="absolute -top-4 -right-4 w-10 h-10 rounded-full bg-white text-gray-800 font-bold shadow-lg flex items-center justify-center hover:bg-blush-100 transition"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').innerHTML = html;
        }

        function renderRacksView(container) {
            let html = `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="font-bold text-lg text-rose-600">Storage & Racks</h2>
                            <p class="text-xs text-gray-400">Configure cabinets, drawers, and customizable shelf units</p>
                        </div>
                        <button onclick="openAddRackModal()" class="px-4 py-2 bg-rose-500 text-white rounded-full text-xs font-semibold hover:bg-rose-600 transition shadow-sm whitespace-nowrap">
                            <i class="fa-solid fa-plus mr-1"></i> Add Rack
                        </button>
                    </div>

                    <div class="space-y-6">
            `;

            db.racks.forEach(rack => {
                const isCollapsed = rack.isCollapsed || false;
                const behaviorText = rack.storageBehavior === 'multibox' ? 'Multi-Box / Multi-Item Shelf' : 'Fixed Layers Only';
                html += `
                    <div class="bg-white rounded-3xl p-5 border border-blush-200 shadow-sm">
                        <!-- Requirement 2: Rack name > Description > Buttons -->
                        <div class="space-y-2 mb-4">
                            <div class="flex items-center space-x-3 cursor-pointer" onclick="toggleRackCollapse('${rack.id}')">
                                <div class="w-10 h-10 rounded-2xl bg-blush-100 text-rose-600 flex items-center justify-center text-lg shrink-0">
                                    ${rack.icon || '🗄'}
                                </div>
                                <div class="min-w-0 flex-1">
                                    <h3 class="font-bold text-gray-800 flex items-center truncate">${rack.name} <i class="fa-solid fa-chevron-${isCollapsed ? 'down' : 'up'} ml-2 text-xs text-gray-400"></i></h3>
                                    <p class="text-[11px] text-gray-400 capitalize">${rack.type} • ${rack.layers} Layers • <span class="text-rose-500 font-medium">${behaviorText}</span></p>
                                </div>
                            </div>
                            
                            <!-- Description -->
                            <p class="text-xs text-gray-500 pl-1">${rack.description || 'No description provided.'}</p>

                            <!-- Buttons -->
                            <div class="flex items-center space-x-1 pt-1">
                                <button onclick="generateQRCode('${rack.id}', '${rack.name.replace(/'/g, "\\'")}')" class="w-8 h-8 rounded-full bg-blush-50 text-blue-500 flex items-center justify-center hover:bg-blush-100 transition" title="View QR Code"><i class="fa-solid fa-qrcode text-xs"></i></button>
                                <button onclick="downloadQRCode('${rack.id}', '${rack.name.replace(/'/g, "\\'")}')" class="w-8 h-8 rounded-full bg-blush-50 text-green-500 flex items-center justify-center hover:bg-blush-100 transition" title="Download QR Code"><i class="fa-solid fa-download text-xs"></i></button>
                                <button onclick="openEditRackModal('${rack.id}')" class="w-8 h-8 rounded-full bg-blush-50 text-rose-500 flex items-center justify-center hover:bg-blush-100 transition" title="Edit Rack"><i class="fa-solid fa-pen text-xs"></i></button>
                                <button onclick="confirmDeleteRack('${rack.id}')" class="w-8 h-8 rounded-full bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-100 transition" title="Delete Rack"><i class="fa-solid fa-trash text-xs"></i></button>
                            </div>
                        </div>
                `;

                if (!isCollapsed) {
                    html += `<div class="space-y-3 pl-2 border-l-2 border-blush-200 ml-3">`;
                    for (let l = 0; l < rack.layers; l++) {
                        const layerItems = db.items.filter(i => i.rackId === rack.id && i.layerIndex === l);
                        const layerBoxes = rack.storageBehavior === 'multibox' ? db.boxes.filter(b => b.locationId === rack.id && b.layerIndex === l) : [];

                        html += `

                        </div>

                        <div class="flex space-x-2">
                            <button onclick="downloadQRCode('${id}', '${name.replace(/'/g, "\\'")}')" class="flex-1 py-2.5 bg-rose-500 text-white rounded-full text-xs font-semibold hover:bg-rose-600 transition shadow-sm">Download QR</button>

                        </div>

            `;
            document.getElementById('modal-container').innerHTML = html;
        }

        function downloadQRCode(id, name) {
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(id)}`;
            const a = document.createElement('a');
            a.href = qrUrl;
            a.download = `${name}-QR.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast("✨ QR Code downloaded successfully!");
        }

        function handleQRImageUpload(event) {

        function simulateScanResult(containerId) {
            const box = db.boxes.find(b => b.id === containerId);
            const rack = db.racks.find(r => r.id === containerId);

            if (box) {
                closeModal();
                openBoxContentsModal(box.id);

                closeModal();
                switchTab('racks');

        function showToast(message) {
            const existing = document.getElementById('toast-notification');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'toast-notification';
            toast.className = 'fixed top-16 left-1/2 transform -translate-x-1/2 bg-gray-900/90 backdrop-blur-md text-white px-5 py-2.5 rounded-full text-xs font-medium shadow-xl z-50 transition animate-bounce';
            toast.innerText = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        window._lastAIAnalysis = { name: '', categoryId: '', notes: '', photo: '' };

        async function processAIImageAnalysis(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const dataUrl = e.target.result;
                window._lastAIAnalysis.photo = dataUrl;

                showToast("✨ Analyzing image with AI...");
                const resultArea = document.getElementById('ocr-results-area');
                const textElem = document.getElementById('ocr-extracted-text');
                resultArea.classList.remove('hidden');
                textElem.innerText = "Examining visual features and text labels...";

                try {
                    const worker = await Tesseract.createWorker('eng');
                    const ret = await worker.recognize(dataUrl);
                    await worker.terminate();

                    const rawText = ret.data.text.trim();
                    const cleanWords = rawText.replace(/[^a-zA-Z0-9\s]/g, ' ').split(/\s+/).filter(w => w.length > 2);
                    
                    let guessedName = "Scanned Treasure";
                    let targetCategory = db.categories[0]?.id || '';
                    let suggestedSize = "Medium Box / Standard Shelf Layer";

                    const textLower = rawText.toLowerCase();
                    if (textLower.includes('keyboard') || textLower.includes('keycap') || textLower.includes('switch')) {
                        guessedName = "Mechanical Keyboard";
                        targetCategory = db.categories.find(c => c.name.toLowerCase().includes('electron') || c.name.toLowerCase().includes('gadget'))?.id || targetCategory;
                        suggestedSize = "Big Brown Box #1 or Metal Shelf Tier";
                    } else if (textLower.includes('pen') || textLower.includes('pencil') || textLower.includes('tape') || textLower.includes('washi')) {
                        guessedName = "Stationery Item";
                        targetCategory = db.categories.find(c => c.name.toLowerCase().includes('stationery'))?.id || targetCategory;
                        suggestedSize = "Small Brown Box or Drawer Layer";
                    } else if (textLower.includes('cream') || textLower.includes('soap') || textLower.includes('skin')) {
                        guessedName = "Skincare Product";
                        targetCategory = db.categories.find(c => c.name.toLowerCase().includes('skin'))?.id || targetCategory;
                        suggestedSize = "Pedestal Cabinet Tier";
                    } else if (cleanWords.length > 0) {
                        guessedName = cleanWords.slice(0, 3).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                    }

                    let matchInfo = "No similar existing item found.";
                    const matchedItem = db.items.find(existing => {
                        const exName = existing.name.toLowerCase();
                        const gName = guessedName.toLowerCase();
                        return exName.includes(gName) || gName.includes(exName) || (cleanWords.some(w => exName.includes(w.toLowerCase())));
                    });

                    if (matchedItem) {
                        let matchedLoc = 'Unassigned';
                        if (matchedItem.boxId) {
                            const box = db.boxes.find(b => b.id === matchedItem.boxId);
                            if (box) matchedLoc = `📦 Box: ${box.name}`;
                        } else if (matchedItem.rackId) {
                            const rack = db.racks.find(r => r.id === matchedItem.rackId);
                            if (rack) matchedLoc = `${rack.icon || '🗄️'} ${rack.name} (Layer ${matchedItem.layerIndex + 1})`;
                        }
                        matchInfo = `⚠️ Similar item already exists: "${matchedItem.name}" -> Currently located at: ${matchedLoc}`;
                    }

                    window._lastAIAnalysis.name = guessedName;
                    window._lastAIAnalysis.categoryId = targetCategory;
                    window._lastAIAnalysis.notes = `AI Identified Item. Suggested Storage Location: ${suggestedSize}`;

                    const catObj = db.categories.find(c => c.id === targetCategory);
                    textElem.innerHTML = `
                        🏷️ <strong>Identified Item:</strong> ${guessedName}<br>
                        📂 <strong>Suggested Category:</strong> ${catObj ? catObj.name : 'General'}<br>
                        📍 <strong>Existing Location Match:</strong> ${matchInfo}
                    `;
                    showToast("✨ AI Image Analysis complete!");
                } catch (err) {
                    console.error("AI Analysis Error:", err);
                    window._lastAIAnalysis.name = "Analyzed Item";
                    window._lastAIAnalysis.categoryId = db.categories[0]?.id || '';
                    window._lastAIAnalysis.notes = "AI Image Analyzer processed image.";
                    textElem.innerText = "Identified Item: Analyzed Item\nExisting Location Match: No similar existing item found.";
                    showToast("✨ Analysis completed.");
                }
            };
            reader.readAsDataURL(file);
        }

        function openAddCategoryModal() { openEditCategoryModal(null); }

            let html = `
                <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl">

                        </div>
                        <form onsubmit="saveCategory(event, '${catId || ''}')" class="space-y-4">

                                <label class="block text-xs font-semibold text-gray-600 mb-1">Category Name</label>
                                <input type="text" id="modal-cat-name" required value="${cat.name}" class="w-full px-4 py-2 bg-blush-50 rounded-2xl border border-blush-200 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400" placeholder="e.g. Kawaii Stationery">
                            </div>
                            <div>

                                <div class="flex items-center space-x-2 flex-wrap gap-y-2">

                                            <div class="w-8 h-8 rounded-full border-2 border-transparent peer-checked:border-gray-800 transition" style="background-color: ${col}"></div>
                                        </label>
                                    `).join('')}
                                    <!-- Requirement 3: Add option to add new color with "+" then popup the color wheel selector then confirm -->

        function openColorWheelSelector(catId) {
            const currentColor = document.getElementById('modal-cat-selected-color')?.value || '#f43f5e';
            let html = `
                <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-xs rounded-3xl p-6 shadow-2xl text-center space-y-4">
                        <div class="flex items-center justify-between mb-1">
                            <h3 class="font-bold text-base text-rose-600">Select Custom Color 🎨</h3>
                            <button onclick="openEditCategoryModal('${catId}')" class="w-7 h-7 rounded-full bg-blush-50 text-gray-500 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <p class="text-xs text-gray-400">Pick any custom shade using the color wheel:</p>
                        <div class="flex justify-center py-2">
                            <input type="color" id="wheel-color-input" value="${currentColor}" class="w-20 h-20 rounded-2xl cursor-pointer border-2 border-blush-200 p-1 bg-white shadow-sm">
                        </div>
                        <div class="flex space-x-2 pt-2">
                            <button type="button" onclick="confirmCustomColor('${catId}')" class="flex-1 py-2 rounded-full text-xs font-semibold bg-rose-500 text-white shadow-sm">Confirm ✨</button>
                            <button type="button" onclick="openEditCategoryModal('${catId}')" class="flex-1 py-2 rounded-full text-xs font-semibold bg-gray-100 text-gray-600">Cancel</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').innerHTML = html;
        }

        function confirmCustomColor(catId) {
            const pickedColor = document.getElementById('wheel-color-input').value;
            openEditCategoryModal(catId);
            setTimeout(() => {
                const colorInput = document.getElementById('modal-cat-selected-color');
                if (colorInput) colorInput.value = pickedColor;
                const customBtn = document.getElementById('custom-color-btn');
                if (customBtn) {
                    customBtn.innerHTML = `<span class="w-full h-full rounded-full block" style="background-color: ${pickedColor}"></span>`;
                }
            }, 50);
        }

        function saveCategory(e, catId) {
            e.preventDefault();
            const name = document.getElementById('modal-cat-name').value;
            const customIconInput = document.getElementById('modal-cat-custom-icon').value.trim();
            const selectedRadio = document.querySelector('input[name="cat-icon"]:checked');
            const color = document.getElementById('modal-cat-selected-color')?.value || document.querySelector('input[name="cat-color"]:checked')?.value || '#f43f5e';

            let icon = 'tag';
            let isCustomIcon = false;
            if (customIconInput) {
                icon = customIconInput;
                isCustomIcon = true;
            } else if (selectedRadio) {
                icon = selectedRadio.value;
                isCustomIcon = false;
            }

            if (catId) {
                const c = db.categories.find(item => item.id === catId);
                if (c) {
                    c.name = name;
                    c.icon = icon;
                    c.color = color;
                    c.isCustomIcon = isCustomIcon;
                }
            } else {
                db.categories.push({
                    id: 'cat-' + Date.now(),
                    name,
                    icon,
                    color,
                    isCustomIcon
                });
            }

            saveDB();
            closeModal();
            renderCurrentView();
            showToast("✨ Category saved!");
        }

        function confirmDeleteCategory(catId) {
            if (confirm("Are you sure you want to delete this category?")) {
                db.categories = db.categories.filter(c => c.id !== catId);
                saveDB();
                renderCurrentView();
                showToast("🗑️ Category deleted.");
            }
        }

        function openAddBoxModal() { openEditBoxModal(null); }
        function openEditBoxModal(boxId) {
            const box = boxId ? db.boxes.find(b => b.id === boxId) : { name: '', type: 'big-brown', icon: '📦', locationId: '' };
            let html = `
                <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-bold text-lg text-rose-600">${boxId ? 'Edit Storage Box' : 'Add Storage Box'}</h3>
                            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-blush-50 text-gray-500 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onsubmit="saveBox(event, '${boxId || ''}')" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Box Name</label>
                                <input type="text" id="modal-box-name" required value="${box.name}" class="w-full px-4 py-2 bg-blush-50 rounded-2xl border border-blush-200 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400" placeholder="e.g. Winter Clothes Box">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">Box Type</label>
                                    <select id="modal-box-type" class="w-full px-4 py-2 bg-blush-50 rounded-2xl border border-blush-200 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400">

                                        <option value="small-brown" ${box.type === 'small-brown' ? 'selected' : ''}>Small Brown Box</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">Icon / Emoji</label>
                                    <input type="text" id="modal-box-icon" required value="${box.icon || '📦'}" class="w-full px-4 py-2 bg-blush-50 rounded-2xl border border-blush-200 text-sm text-center focus:outline-none focus:ring-2 focus:ring-rose-400" placeholder="📦">
                                </div>

                                <label class="block text-xs font-semibold text-gray-600 mb-1">Assign to Rack/Shelf (Optional)</label>
                                <select id="modal-box-rack" class="w-full px-4 py-2 bg-blush-50 rounded-2xl border border-blush-200 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400">
                                    <option value="">Unassigned (Independent)</option>
                                    ${db.racks.map(r => `<option value="${r.id}" ${box.locationId === r.id ? 'selected' : ''}>${r.name}</option>`).join('')}
                                </select>
                            </div>
                            <div class="flex justify-end space-x-2 pt-3">
                                <button type="button" onclick="closeModal()" class="px-5 py-2 rounded-full text-xs font-semibold bg-gray-100 text-gray-600 whitespace-nowrap">Cancel</button>
                                <button type="submit" class="px-5 py-2 rounded-full text-xs font-semibold bg-rose-500 text-white shadow-sm whitespace-nowrap">Save Box</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').innerHTML = html;
        }

        function saveBox(e, boxId) {
            e.preventDefault();
            const name = document.getElementById('modal-box-name').value;
            const type = document.getElementById('modal-box-type').value;
            const icon = document.getElementById('modal-box-icon').value;
            const locationId = document.getElementById('modal-box-rack').value;

            if (boxId) {
                const b = db.boxes.find(item => item.id === boxId);
                if (b) {
                    b.name = name;
                    b.type = type;
                    b.icon = icon;
                    b.locationId = locationId || null;
                }
            } else {
                db.boxes.push({
                    id: 'box-' + Date.now(),
                    name,
                    type,
                    icon,
                    locationId: locationId || null,
                    layerIndex: 0
                });
            }

            saveDB();
            closeModal();
            renderCurrentView();
            showToast("✨ Box saved successfully!");
        }

        function confirmDeleteBox(boxId) {
            if (confirm("Are you sure you want to delete this box? Items inside will become unassigned.")) {
                db.items.forEach(i => { if (i.boxId === boxId) i.boxId = null; });
                db.boxes = db.boxes.filter(b => b.id !== boxId);
                saveDB();
                renderCurrentView();
                showToast("🗑 Box deleted.");
            }
        }

        function openBoxContentsModal(boxId) {

                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-bold text-lg text-rose-600">${box.icon || '📦'} ${box.name} Contents</h3>
                            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-blush-50 text-gray-500 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>

        function openSettingsModal() {
            let html = `
                <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="font-bold text-lg text-rose-600">Settings & Backup (v3.14) ⚙️</h3>
                            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-blush-50 text-gray-500 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="space-y-3">
                            <button onclick="exportJSONBackup()" class="w-full py-3 bg-blush-50 text-rose-600 rounded-2xl text-xs font-semibold hover:bg-blush-100 transition flex items-center justify-center space-x-2 whitespace-nowrap">
                                <i class="fa-solid fa-download"></i>
                                <span>Export Complete JSON Backup (All Data & Images)</span>
                            </button>
                            <label class="w-full py-3 bg-blush-50 text-rose-600 rounded-2xl text-xs font-semibold hover:bg-blush-100 transition flex items-center justify-center space-x-2 cursor-pointer whitespace-nowrap">
                                <i class="fa-solid fa-upload"></i>
                                <span>Import JSON Backup</span>
                                <input type="file" accept=".json" onchange="importJSONBackup(event)" class="hidden">
                            </label>
                            <button onclick="if(confirm('Reset all data to factory defaults?')) { resetToFactoryDefaults(); closeModal(); }" class="w-full py-3 bg-red-50 text-red-500 rounded-2xl text-xs font-semibold hover:bg-red-100 transition flex items-center justify-center space-x-2 whitespace-nowrap">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>Factory Reset</span>
                            </button>
                        </div>
                        <button onclick="closeModal()" class="w-full py-2.5 bg-gray-100 text-gray-600 rounded-full text-xs font-semibold whitespace-nowrap">Close</button>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').innerHTML = html;
        }

        function exportJSONBackup() {
            try {
                const exportPayload = {
                    version: "3.14",
                    exportDate: new Date().toISOString(),
                    items: db.items || [],
                    racks: db.racks || [],
                    boxes: db.boxes || [],
                    categories: db.categories || []
                };
                const jsonStr = JSON.stringify(exportPayload, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const downloadAnchor = document.createElement('a');
                downloadAnchor.href = url;
                downloadAnchor.download = `hoardbox_v314_complete_backup_${Date.now()}.json`;
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                document.body.removeChild(downloadAnchor);
                URL.revokeObjectURL(url);
                showToast("✨ Complete JSON backup (with all data and image thumbnails) downloaded successfully!");
            } catch (err) {
                console.error("Export error:", err);
                showToast("⚠️ Export failed. Please try again.");
            }
        }

        function importJSONBackup(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (imported && (imported.items || imported.racks || imported.boxes)) {
                            db = {
                                items: imported.items || [],
                                racks: imported.racks || [],
                                boxes: imported.boxes || [],
                                categories: imported.categories || []
                            };
                            saveDB();
                            renderCurrentView();
                            closeModal();
                            showToast("✨ Backup restored successfully!");
                        } else {
                            alert("Invalid backup file structure. Please upload a valid HoardBox backup file.");
                        }
                    } catch (err) {
                        alert("Failed to parse JSON file.");
                    }
                };
                reader.readAsText(file);
            }
        }

        window.onload = function() {
            loadDB();
            renderCurrentView();
        };
    </script>
