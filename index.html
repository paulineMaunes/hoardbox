<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storage Manager v3.13</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

  <!-- Header Section -->
  <header class="flex justify-between items-center p-4 border-b bg-white relative shadow-sm">
    <h1 class="text-xl font-bold">Storage Manager <span class="text-xs text-gray-500 font-normal">v3.13</span></h1>
    
    <!-- Top-right action group -->
    <div class="flex items-center gap-2">
      <button id="scan-qr-btn" onclick="openQRScanner()" class="flex items-center gap-1 bg-blue-600 text-white px-3 py-1.5 rounded-md text-sm font-medium hover:bg-blue-700 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
        </svg>
        Scan QR
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 p-4 max-w-4xl w-full mx-auto">
    <section class="mb-6">
      <h2 class="text-lg font-semibold mb-3">Boxes & Drawer Layers</h2>
      
      <!-- Container List -->
      <div id="storage-container-list" class="space-y-3">
        
        <!-- Example Box / Drawer Layer Item -->
        <div class="flex items-center justify-between p-3 border rounded-lg bg-white shadow-sm">
          <div>
            <span class="font-medium text-gray-800">Box A - Top Drawer</span>
          </div>
          <div class="flex items-center gap-1.5">
            <!-- QR Options -->
            <button onclick="generateQRCode('box-a-top', 'Box A - Top Drawer')" title="View QR Code" class="p-1.5 text-gray-600 hover:text-blue-600 rounded transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm14 0h2v2h-2v-2zm-4 0h2v2h-2v-2zm2 4h2v2h-2v-2zm-2 2h2v2h-2v-2z" /></svg>
            </button>
            <button onclick="downloadQRCode('box-a-top', 'Box A - Top Drawer')" title="Download QR Code" class="p-1.5 text-gray-600 hover:text-green-600 rounded transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
            </button>
          </div>
        </div>

      </div>
    </section>
  </main>

  <!-- QR Result Modal -->
  <div id="qr-result-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
    <div class="bg-white rounded-lg p-5 max-w-md w-full shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h3 id="qr-modal-title" class="font-bold text-lg text-gray-900">Box Contents</h3>
        <button onclick="closeQRModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>
      <!-- Items Container -->
      <div id="qr-items-list" class="space-y-3 max-h-96 overflow-y-auto pr-1">
        <!-- Dynamically injected items -->
      </div>
    </div>
  </div>

  <!-- QR Display Modal (For viewing a single QR code) -->
  <div id="qr-display-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
    <div class="bg-white rounded-lg p-5 max-w-sm w-full text-center shadow-xl">
      <h3 id="qr-display-title" class="font-bold text-base text-gray-900 mb-3"></h3>
      <div id="qr-image-container" class="flex justify-center mb-4">
        <!-- QR Code Image -->
      </div>
      <button onclick="closeQRDisplayModal()" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-300 w-full transition">Close</button>
    </div>
  </div>

  <!-- Script Implementation -->
  <script>
    // Sample mock database for demonstration
    const mockStorageData = {
      'box-a-top': {
        name: 'Box A - Top Drawer',
        items: [
          { name: 'Screws (M4)', quantity: 45, thumbnail: 'https://via.placeholder.com/40' },
          { name: 'Washers', quantity: 120, thumbnail: 'https://via.placeholder.com/40' }
        ]
      }
    };

    function showScannedBoxContents(boxId) {
      const boxData = mockStorageData[boxId];
      const titleEl = document.getElementById('qr-modal-title');
      const listEl = document.getElementById('qr-items-list');
      
      if (!boxData) {
        titleEl.textContent = 'Unknown Box';
        listEl.innerHTML = `<p class="text-sm text-gray-500 text-center py-4">No matching box or layer found for this QR code.</p>`;
      } else {
        titleEl.textContent = `Contents: ${boxData.name}`;
        listEl.innerHTML = '';

        if (!boxData.items || boxData.items.length === 0) {
          listEl.innerHTML = `<p class="text-sm text-gray-500 text-center py-4">No items found in this box/layer.</p>`;
        } else {
          boxData.items.forEach(item => {
            listEl.innerHTML += `
              <div class="flex items-center justify-between border-b pb-2">
                <div class="flex items-center gap-3">
                  <img src="${item.thumbnail}" alt="" class="w-10 h-10 object-cover rounded border">
                  <div>
                    <p class="text-sm font-medium text-gray-800">${item.name}</p>
                  </div>
                </div>
                <span class="text-sm font-semibold bg-gray-100 px-2.5 py-1 rounded">Qty: ${item.quantity}</span>
              </div>`;
          });
        }
      }

      document.getElementById('qr-result-modal').classList.remove('hidden');
    }

    function closeQRModal() {
      document.getElementById('qr-result-modal').classList.add('hidden');
    }

    function generateQRCode(id, name) {
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(id)}`;
      document.getElementById('qr-display-title').textContent = name;
      document.getElementById('qr-image-container').innerHTML = `<img src="${qrUrl}" alt="QR Code" class="border p-2 rounded">`;
      document.getElementById('qr-display-modal').classList.remove('hidden');
    }

    function closeQRDisplayModal() {
      document.getElementById('qr-display-modal').classList.add('hidden');
    }

    function downloadQRCode(id, name) {
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(id)}`;
      const a = document.createElement('a');
      a.href = qrUrl;
      a.download = `${name}-QR.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function openQRScanner() {
      // Simulating a successful scan of 'box-a-top' for testing/demonstration purposes
      showScannedBoxContents('box-a-top');
    }
  </script>
</body>
</html>
