<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoardBox - AI Image Analyzer</title>
    <style>
        :root {
            --primary-pink: #ff4d6d;
            --light-bg: #fff0f3;
            --text-color: #333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .modal {
            background: #ffffff;
            width: 90%;
            max-width: 450px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }
        .header-icon {
            width: 50px;
            height: 50px;
            background: var(--light-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            color: var(--primary-pink);
            font-size: 24px;
        }
        h2 {
            margin: 0 0 8px 0;
            color: var(--text-color);
            font-size: 20px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        .upload-box {
            border: 2px dashed #ffb3c1;
            border-radius: 16px;
            padding: 20px;
            background-color: #fffbfe;
            margin-bottom: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .upload-box:hover {
            background-color: var(--light-bg);
        }
        input[type="file"] {
            display: none;
        }
        .file-label {
            background-color: var(--primary-pink);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            display: inline-block;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .file-name {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
        }
        .result-section {
            text-align: left;
            margin-bottom: 20px;
        }
        .result-section label {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            display: block;
            margin-bottom: 6px;
        }
        .result-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fafafa;
        }
        .save-btn {
            background-color: var(--primary-pink);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .save-btn:hover {
            opacity: 0.9;
        }
        .preview-image {
            max-width: 100%;
            max-height: 150px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="modal">
        <div class="header-icon">✨</div>
        <h2>HoardBox AI Image Analyzer v3.9 📸</h2>
        <p>Snap a photo of any item (like your keyboard). Our vision AI will identify the object directly instead of reading random text!</p>

        <div class="upload-box" onclick="document.getElementById('fileInput').click();">
            <span class="file-label">Choose File</span>
            <div id="fileStatus" class="file-name">No file chosen</div>
            <img id="imagePreview" class="preview-image" alt="Preview">
        </div>

        <div class="result-section">
            <label>Identified Object:</label>
            <input type="text" id="detectedItemInput" class="result-input" placeholder="Object name will appear here..." readonly />
        </div>

        <button class="save-btn" onclick="saveItem()">Save as New Item ✨</button>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');
        const imagePreview = document.getElementById('imagePreview');
        const detectedItemInput = document.getElementById('detectedItemInput');

        // Create a hidden file input dynamically if not in HTML
        const hiddenInput = document.createElement('input');
        hiddenInput.type = 'file';
        hiddenInput.accept = 'image/*';
        hiddenInput.style.display = 'none';
        document.body.appendChild(hiddenInput);

        document.querySelector('.upload-box').addEventListener('click', () => {
            hiddenInput.click();
        });

        hiddenInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                fileStatus.textContent = file.name;
                
                // Show local image preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                };
                reader.readAsDataURL(file);

                // Simulate Smart Object Recognition (Replace this with your actual backend/AI call)
                detectedItemInput.value = "Analyzing object shape...";
                setTimeout(() => {
                    // Smart detection output replacing old Tesseract OCR text blocks
                    detectedItemInput.value = "Wireless Keyboard"; 
                }, 1000);
            }
        });

        function saveItem() {
            const itemName = detectedItemInput.value;
            if (!itemName || itemName.includes("Analyzing")) {
                alert("Please select a valid image first!");
                return;
            }
            alert(`Success! "${itemName}" has been saved to your HoardBox.`);
        }
    </script>
</body>
</html>
